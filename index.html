<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>簡易POS - 卓管理</title>
    <script src="https://jsdelivr.net"></script>
    <!-- Supabase CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>body { overscroll-behavior-y: contain; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-24">

    <!-- Supabase設定用オーバーレイ（未接続時に表示） -->
    <div id="setup-overlay" class="fixed inset-0 bg-gray-900/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
            <h2 class="text-xl font-bold text-gray-900 mb-2">Supabase接続設定</h2>
            <p class="text-xs text-gray-500 mb-4">プロジェクトのAPI情報を入力してアプリを初期化します。</p>
            <div class="space-y-3 mb-6">
                <div>
                    <label class="text-xs font-bold text-gray-700 block mb-1">Project URL</label>
                    <input id="supa-url" type="text" placeholder="https://supabase.co" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-700 block mb-1">Anon Key</label>
                    <input id="supa-key" type="password" placeholder="eyJhbGciOi..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
                </div>
            </div>
            <button onclick="saveSettings()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md active:bg-blue-700">接続して初期化</button>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <header class="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center z-10 shadow-xs">
        <div>
            <h1 class="text-lg font-bold text-gray-900">スマートPOS</h1>
            <p class="text-xs text-gray-500">店舗・卓状況一覧</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="clearSettings()" class="text-xs text-gray-400 border border-gray-200 px-2 py-1 rounded-md hover:bg-gray-50">設定クリア</button>
            <div id="sync-indicator" class="h-2 w-2 rounded-full bg-red-400"></div>
        </div>
    </header>

    <section class="p-4 grid grid-cols-3 gap-3 bg-white border-b border-gray-200">
        <div class="bg-gray-50 p-3 rounded-xl text-center"><span class="text-xs text-gray-500 block mb-1">総座席数</span><span class="text-xl font-bold text-gray-700">10 卓</span></div>
        <div class="bg-green-50 p-3 rounded-xl text-center"><span class="text-xs text-green-700 block mb-1">空席</span><span id="summary-empty" class="text-xl font-bold text-green-600">0</span></div>
        <div class="bg-amber-50 p-3 rounded-xl text-center"><span class="text-xs text-amber-700 block mb-1">利用中</span><span id="summary-using" class="text-xl font-bold text-amber-600">0</span></div>
    </section>

    <main class="p-4">
        <div class="grid grid-cols-2 gap-4" id="table-grid"></div>
    </main>

    <!-- ボトムシート -->
    <div id="bottom-sheet" class="fixed inset-0 bg-black/40 z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0" onclick="closeSheet()"></div>
        <div class="relative bg-white w-full max-w-md rounded-t-2xl p-6 shadow-xl transform translate-y-full transition-transform duration-300" id="sheet-content">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-5"></div>
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 id="sheet-table-title" class="text-xl font-bold text-gray-900"></h3>
                    <p id="sheet-table-status" class="text-sm font-medium mt-1"></p>
                </div>
                <button onclick="closeSheet()" class="text-gray-400 p-1 bg-gray-100 rounded-full">
                    <svg xmlns="http://w3.org" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div id="sheet-order-preview" class="mb-6 p-3 bg-gray-50 rounded-xl hidden">
                <span class="text-xs text-gray-500 font-bold block mb-2">現在の注文内容（仮）</span>
                <div class="text-sm space-y-1 text-gray-700">
                    <div class="flex justify-between"><span>豚汁定食 × 1</span><span>¥850</span></div>
                    <div class="border-t border-dashed border-gray-300 my-1 pt-1 flex justify-between font-bold text-gray-900"><span>合計金額</span><span id="sheet-total-preview">¥0</span></div>
                </div>
            </div>
            <div class="space-y-3" id="sheet-actions"></div>
        </div>
    </div>

    <script>
        let supabaseClient = null;
        let tables = [];
        let activeTableId = null;

        window.onload = function() {
            const url = localStorage.getItem('supa_url');
            const key = localStorage.getItem('supa_key');
            if (url && key) {
                initSupabase(url, key);
            } else {
                document.getElementById('setup-overlay').classList.remove('hidden');
            }
        }

        function saveSettings() {
            const url = document.getElementById('supa-url').value.trim();
            const key = document.getElementById('supa-key').value.trim();
            if (!url || !key) return alert('両方入力してください');
            localStorage.setItem('supa_url', url);
            localStorage.setItem('supa_key', key);
            document.getElementById('setup-overlay').classList.add('hidden');
            initSupabase(url, key);
        }

        function clearSettings() {
            localStorage.clear();
            location.reload();
        }

        async function initSupabase(url, key) {
            try {
                supabaseClient = supabase.createClient(url, key);
                document.getElementById('sync-indicator').className = 'h-2 w-2 rounded-full bg-green-500';
                await fetchTables();
                subscribeRealtime();
            } catch (e) {
                alert('接続に失敗しました。設定をクリアしてやり直してください。');
            }
        }

        async function fetchTables() {
            const { data, error } = await supabaseClient.from('tables').select('*').order('table_number', { ascending: true });
            if (error) return console.error(error);
            tables = data;
            renderTables();
        }

        function subscribeRealtime() {
            supabaseClient.channel('custom-all-channel')
            .on('postgres_changes', { event: 'UPDATE', scheme: 'public', table: 'tables' }, (payload) => {
                const idx = tables.findIndex(t => t.id === payload.new.id);
                if (idx !== -1) {
                    tables[idx] = payload.new;
                    renderTables();
                    if (activeTableId === payload.new.id) {
                        openSheet(activeTableId);
                    }
                }
            }).subscribe();
        }

        function renderTables() {
            const grid = document.getElementById('table-grid');
            grid.innerHTML = '';
            let emptyCount = 0; let usingCount = 0;

            tables.forEach(table => {
                const isUsing = table.status === 'using';
                if (isUsing) usingCount++; else emptyCount++;

                const card = document.createElement('div');
                card.className = `p-5 rounded-2xl border transition-all active:scale-98 cursor-pointer shadow-sm ${isUsing ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-white border-gray-200 text-gray-700'}`;
                card.onclick = () => openSheet(table.id);
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-lg font-bold">${table.table_number}番卓</span>
                        <span class="px-2.5 py-1 text-xs font-bold rounded-full ${isUsing ? 'bg-amber-200 text-amber-800' : 'bg-green-100 text-green-700'}">${isUsing ? '利用中' : '空です'}</span>
                    </div>
                    <div class="text-right mt-2">
                        <span class="text-xs text-gray-400 block">現在金額</span>
                        <span class="text-lg font-black ${isUsing ? 'text-amber-700' : 'text-gray-300'}">¥${Number(table.current_amount).toLocaleString()}</span>
                    </div>`;
                grid.appendChild(card);
            });
            document.getElementById('summary-empty').innerText = emptyCount;
            document.getElementById('summary-using').innerText = usingCount;
        }

        function openSheet(tableId) {
            activeTableId = tableId;
            const table = tables.find(t => t.id === tableId);
            document.getElementById('sheet-table-title').innerText = `${table.table_number}番卓`;
            
            const statusEl = document.getElementById('sheet-table-status');
            const previewEl = document.getElementById('sheet-order-preview');
            const actionsEl = document.getElementById('sheet-actions');

            if (table.status === 'using') {
                statusEl.innerHTML = `<span class="text-amber-600 font-bold">● 利用中</span>`;
                document.getElementById('sheet-total-preview').innerText = `¥${Number(table.current_amount).toLocaleString()}`;
                previewEl.classList.remove('hidden');
                actionsEl.innerHTML = `
                    <button onclick="alert('ステップ2で実装予定')" class="w-full bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-md">注文を追加・変更する</button>
