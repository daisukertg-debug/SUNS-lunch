<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>簡易POS - 注文入力</title>
    <!-- Macやスマホでも絶対にエラーにならない安定版のTailwind CSS v3 -->
    <script src="https://tailwindcss.com"></script>
    <style>body { overscroll-behavior-y: contain; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-24">

    <!-- 【メイン：卓一覧画面】 -->
    <div id="view-tables">
        <header class="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center z-10 shadow-sm">
            <div>
                <h1 class="text-lg font-bold text-gray-900">スマートPOS</h1>
                <p class="text-xs text-gray-500">店舗・卓状況一覧</p>
            </div>
        </header>

        <!-- 稼働状況サマリー -->
        <section class="p-4 grid grid-cols-3 gap-3 bg-white border-b border-gray-200">
            <div class="bg-gray-50 p-3 rounded-xl text-center"><span class="text-xs text-gray-500 block mb-1">総座席数</span><span class="text-xl font-bold text-gray-700">10 卓</span></div>
            <div class="bg-green-50 p-3 rounded-xl text-center"><span class="text-xs text-green-700 block mb-1">空席</span><span id="summary-empty" class="text-xl font-bold text-green-600">10</span></div>
            <div class="bg-amber-50 p-3 rounded-xl text-center"><span class="text-xs text-amber-700 block mb-1">利用中</span><span id="summary-using" class="text-xl font-bold text-amber-600">0</span></div>
        </section>

        <!-- 卓一覧グリッド -->
        <main class="p-4">
            <div class="grid grid-cols-2 gap-4" id="table-grid"></div>
        </main>

        <!-- 操作パネル（ボトムシート） -->
        <div id="bottom-sheet" class="fixed inset-0 bg-black/40 z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="absolute inset-0" onclick="closeSheet()"></div>
            <div class="relative bg-white w-full max-w-md rounded-t-2xl p-6 shadow-xl transform translate-y-full transition-transform duration-300" id="sheet-content">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-5"></div>
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 id="sheet-table-title" class="text-xl font-bold text-gray-900"></h3>
                        <p id="sheet-table-status" class="text-sm font-medium mt-1"></p>
                    </div>
                    <button onclick="closeSheet()" class="text-gray-400 p-2 bg-gray-100 rounded-full font-bold">✕</button>
                </div>
                <div class="space-y-3" id="sheet-actions"></div>
            </div>
        </div>
    </div>

    <!-- 【サブ：注文入力・メニュー選択画面】 -->
    <div id="view-order" class="hidden fixed inset-0 bg-white z-40 flex flex-col">
        <header class="bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center shadow-sm">
            <button onclick="backToTables()" class="text-blue-600 font-bold p-1">← 戻る</button>
            <h2 id="order-screen-title" class="text-lg font-bold text-gray-900">注文入力</h2>
            <div class="w-10"></div>
        </header>

        <!-- メニュー・数量選択リスト -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50" id="menu-list">
            <!-- JavaScriptで自動生成 -->
        </main>

        <!-- 下部注文確定バー -->
        <footer class="bg-white border-t border-gray-200 p-4 shadow-lg flex justify-between items-center">
            <div>
                <span class="text-xs text-gray-400 block">合計金額</span>
                <span id="order-total-amount" class="text-xl font-black text-gray-900">¥0</span>
            </div>
            <button onclick="submitOrder()" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-md active:bg-blue-700">
                注文を確定する
            </button>
        </footer>
    </div>

    <script>
        const menuItems = [
            { id: 'm1', name: '豚汁定食', price: 850 },
            { id: 'm2', name: 'カレーライス', price: 750 },
            { id: 'm3', name: 'ミニサラダ', price: 200 },
            { id: 'm4', name: 'ウーロン茶', price: 250 }
        ];

        let tables = [];
        let activeTableId = null;
        let currentCart = {};

        function initApp() {
            const savedData = localStorage.getItem('pos_demo_tables');
            if (savedData) {
                tables = JSON.parse(savedData);
            } else {
                tables = Array.from({ length: 10 }, (_, i) => ({
                    id: i + 1,
                    table_number: i + 1,
                    status: 'empty',
                    current_amount: 0,
                    orders: {}
                }));
                saveToStorage();
            }
            renderTables();
        }

        function saveToStorage() {
            localStorage.setItem('pos_demo_tables', JSON.stringify(tables));
        }

        function renderTables() {
            const grid = document.getElementById('table-grid');
            grid.innerHTML = '';
            let emptyCount = 0; let usingCount = 0;

            tables.forEach(table => {
                const isUsing = table.status === 'using';
                if (isUsing) usingCount++; else emptyCount++;

                const card = document.createElement('div');
                card.className = `p-5 rounded-2xl border transition-all duration-150 active:scale-98 cursor-pointer shadow-sm ${
                    isUsing ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-white border-gray-200 text-gray-700'
                }`;
                card.onclick = () => openSheet(table.id);
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-lg font-bold">${table.table_number}番卓</span>
                        <span class="px-2.5 py-1 text-xs font-bold rounded-full ${isUsing ? 'bg-amber-200 text-amber-800' : 'bg-green-100 text-green-700'}">${isUsing ? '利用中' : '空です'}</span>
                    </div>
                    <div class="text-right mt-2">
                        <span class="text-xs text-gray-400 block">現在金額</span>
                        <span class="text-lg font-black ${isUsing ? 'text-amber-700' : 'text-gray-300'}">¥${Number(table.current_amount).toLocaleString()}</span>
                    </div>`;
                grid.appendChild(card);
            });
            document.getElementById('summary-empty').innerText = emptyCount;
            document.getElementById('summary-using').innerText = usingCount;
        }

        function openSheet(tableId) {
            activeTableId = tableId;
            const table = tables.find(t => t.id === tableId);
            document.getElementById('sheet-table-title').innerText = `${table.table_number}番卓`;
            
            const statusEl = document.getElementById('sheet-table-status');
            const actionsEl = document.getElementById('sheet-actions');

            if (table.status === 'using') {
                statusEl.innerHTML = `<span class="text-amber-600 font-bold">● 利用中</span> (現在: ¥${Number(table.current_amount).toLocaleString()})`;
                actionsEl.innerHTML = `
                    <button onclick="openOrderScreen()" class="w-full bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-md">注文を追加・変更する</button>
                    <button onclick="clearTable()" class="w-full bg-gray-100 text-red-600 font-bold py-3.5 px-4 rounded-xl">会計して空席に戻す</button>
                `;
            } else {
                statusEl.innerHTML = `<span class="text-green-600 font-bold">○ 空席</span>`;
                actionsEl.innerHTML = `
                    <button onclick="openOrderScreen()" class="w-full bg-green-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-md">客入れ＆注文を入力する</button>
                `;
            }
            
            const sheet = document.getElementById('bottom-sheet');
            const content = document.getElementById('sheet-content');
            sheet.classList.remove('hidden');
            setTimeout(() => { sheet.classList.add('opacity-100'); content.classList.remove('translate-y-full'); }, 10);
        }

        function closeSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const content = document.getElementById('sheet-content');
            sheet.classList.remove('opacity-100'); content.classList.add('translate-y-full');
            setTimeout(() => { sheet.classList.add('hidden'); activeTableId = null; }, 300);
        }

        function openOrderScreen() {
            const table = tables.find(t => t.id === activeTableId);
            document.getElementById('order-screen-title').innerText = `${table.table_number}番卓 の注文`;
            currentCart = Object.assign({}, table.orders || {});
            
            renderMenuList();
            updateOrderTotal();

            document.getElementById('view-tables').classList.add('hidden');
            document.getElementById('view-order').classList.remove('hidden');
            closeSheet();
        }

        function backToTables() {
            document.getElementById('view-order').classList.add('hidden');
            document.getElementById('view-tables').classList.remove('hidden');
        }

        function renderMenuList() {
            const container = document.getElementById('menu-list');
            container.innerHTML = '';

            menuItems.forEach(item => {
                const count = currentCart[item.id] || 0;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-4 bg-white rounded-xl border border-gray-200 shadow-sm';
                div.innerHTML = `
                    <div>
                        <span class="font-bold block text-gray-900">${item.name}</span>
